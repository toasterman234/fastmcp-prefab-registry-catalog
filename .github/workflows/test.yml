name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q app tests scripts

  browser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and browser test dependency
        run: python -m pip install -e '.[test,ui-test]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start FastMCP Apps preview
        run: |
          fastmcp dev apps app/server.py --mcp-port 9000 --dev-port 9090 --no-reload > /tmp/fastmcp-apps.log 2>&1 &
          echo $! > /tmp/fastmcp-apps.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9090/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fastmcp-apps.log
          exit 1
      - name: Verify catalog in Chromium
        env:
          CATALOG_DEV_PORT: "9090"
        run: python scripts/verify_catalog_ui.py
      - name: Show FastMCP log on failure
        if: failure()
        run: cat /tmp/fastmcp-apps.log || true
      - name: Stop FastMCP Apps preview
        if: always()
        run: |
          if [ -f /tmp/fastmcp-apps.pid ]; then
            kill "$(cat /tmp/fastmcp-apps.pid)" || true
          fi


  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install web shell
        run: npm install
      - name: Build web shell
        run: npm run build
