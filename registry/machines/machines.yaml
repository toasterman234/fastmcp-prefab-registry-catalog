- id: machine.mac-mini
  kind: machine
  name: Mac Mini
  description: Primary Mac Mini development machine
  status: active
  source:
    type: registry-yaml
    uri: registry://machines/machines.yaml#mac-mini
    authority: catalog
    refresh: manual
    writeback: controlled
  interfaces:
    - type: control-plane
      uri: github://toasterman234/github-workflows-control-plane
      adapter: governed-mac-request
      status: declared
      operations:
        - inspect
        - execute-governed
  capabilities:
    - macos
    - local-development
  relationships: {}
  metadata:
    seed: true
    example: true

