id: agent.pi.mac
kind: agent
name: Pi
description: Pi agent running on the Mac
status: active
location:
  machine: machine.mac-mini
source:
  type: registry-yaml
  uri: registry://agents/pi.yaml
  authority: catalog
  refresh: manual
  writeback: controlled
interfaces:
  - type: cli
    uri: cli://pi
    adapter: pi
    status: declared
    operations:
      - inspect
      - invoke
capabilities:
  - filesystem
  - github
  - browser
relationships:
  runs_on:
    - machine.mac-mini
  uses:
    - skill.root-cause-analysis
    - skill.browser-verification
  governed_by:
    - policy.browser-verification-required
    - policy.evidence-before-completion
metadata:
  seed: true
  example: true
